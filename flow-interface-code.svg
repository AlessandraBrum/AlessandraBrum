<svg xmlns="http://www.w3.org/2000/svg" width="280" height="330" viewBox="0 0 280 330" role="img" aria-labelledby="titulo descricao" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- ============================================================ -->
  <!-- "From interface to code" flow · same look as the portfolio   -->
  <!-- A animação roda UMA vez (menos de 5 segundos) e para no       -->
  <!-- estado final. Com "reduzir movimento" ligado no sistema       -->
  <!-- operacional, nada se move: a imagem já aparece pronta.        -->
  <!-- ============================================================ -->
  <title id="titulo">From interface to code</title>
  <desc id="descricao">Six-step flow, from interface to code: 01 existing design, 02 structure, 03 implementation, 04 responsive design, 05 accessibility, 06 refinement.</desc>

  <!-- INÍCIO ESTILOS -->
  <style>
    /* Paleta do portfólio (todas as cores de texto passam no AAA sobre o fundo #100E18) */
    text { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    .fundo { fill: #100E18; stroke: #2B2340; }

    /* Rótulo "interface → código" (estado final) */
    .from-box { fill: #141020; stroke: #3D3160; }
    .from-txt { fill: #F1EEF8; font-size: 15px; }
    .seta { fill: #B4A3FF; font-size: 15px; }
    .to-box { fill: #B4A3FF; }
    .to-glow { fill: #B4A3FF; opacity: .45; }
    .to-txt { fill: #100E18; font-size: 15px; font-weight: 700; }

    /* Trilho tracejado e trilho aceso */
    .trilho { stroke: #3D3160; stroke-width: 1; stroke-dasharray: 3 3; }
    .trilho-aceso { stroke: #B4A3FF; stroke-width: 1.5; }

    /* Etapas (estado final: losango preenchido, número lilás, texto claro) */
    .diamond { fill: #B4A3FF; stroke: #B4A3FF; stroke-width: 1.5; transform-box: fill-box; transform-origin: center; }
    .num { fill: #B4A3FF; font-size: 14px; }
    .label { fill: #F1EEF8; font-size: 16px; }
    .cometa { fill: #C9BEFF; opacity: 0; }

    /* INÍCIO ANIMAÇÕES */
    .from-box { animation: interface-acende 1.2s ease .2s both; }
    .seta { animation: seta-avanca 1.2s ease .2s both; }
    .to-box, .to-glow { animation: codigo-acende .6s ease 4s both; }
    .trilho-aceso { stroke-dasharray: 218; animation: trilho-cresce 3.3s linear .6s both; }
    .cometa { animation: cometa-desce 3.3s linear .6s both; }
    .diamond { animation: losango-acende .6s ease both; }
    .num { animation: numero-acende .6s ease both; }
    .label { animation: texto-acende .6s ease both; }

    @keyframes interface-acende { 0% { stroke: #3D3160; } 40%, 70% { stroke: #B4A3FF; } 100% { stroke: #3D3160; } }
    @keyframes seta-avanca { 0% { transform: translateX(0); } 40%, 70% { transform: translateX(4px); } 100% { transform: translateX(0); } }
    @keyframes codigo-acende { 0% { fill: #8064C8; opacity: .6; } 100% { } }
    @keyframes trilho-cresce { from { stroke-dashoffset: 218; } to { stroke-dashoffset: 0; } }
    @keyframes cometa-desce { 0% { transform: translateY(0); opacity: 1; } 92% { opacity: 1; } 100% { transform: translateY(218px); opacity: 0; } }
    @keyframes losango-acende { 0% { fill: #171320; stroke: #8064C8; transform: scale(1); } 40% { fill: #C9BEFF; stroke: #C9BEFF; transform: scale(1.35); } 100% { transform: scale(1); } }
    @keyframes numero-acende { 0% { fill: #A49DBD; } 100% { } }
    @keyframes texto-acende { 0% { fill: #A49DBD; transform: translateX(0); } 40% { fill: #FFFFFF; transform: translateX(4px); } 100% { transform: translateX(0); } }
    /* FIM ANIMAÇÕES */

    /* INÍCIO MOVIMENTO REDUZIDO: o sistema operacional manda, sem exceção */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .cometa { display: none; }
    }
    /* FIM MOVIMENTO REDUZIDO */
  </style>
  <!-- FIM ESTILOS -->

  <!-- INÍCIO FUNDO (card escuro: fica bonito no tema claro e no escuro do GitHub) -->
  <rect class="fundo" x="0.5" y="0.5" width="279" height="329" rx="12"/>
  <!-- FIM FUNDO -->

  <!-- INÍCIO RÓTULO "interface → código" -->
  <rect class="from-box" x="24.5" y="22.5" width="104" height="30" rx="4"/>
  <text class="from-txt" x="76.5" y="42.5" text-anchor="middle">interface</text>
  <text class="seta" x="140" y="42.5">→</text>
  <rect class="to-glow" x="164" y="20" width="64" height="35" rx="6" filter="url(#brilho)"/>
  <rect class="to-box" x="166" y="22" width="60" height="31" rx="4"/>
  <text class="to-txt" x="196" y="42.5" text-anchor="middle">code</text>
  <!-- FIM RÓTULO -->

  <!-- INÍCIO TRILHO -->
  <defs>
    <filter id="brilho" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <line class="trilho" x1="34" y1="78" x2="34" y2="312"/>
  <line class="trilho-aceso" x1="34" y1="78" x2="34" y2="296"/>
  <circle class="cometa" cx="34" cy="78" r="3.5" filter="url(#brilho)"/>
  <circle class="cometa" cx="34" cy="78" r="3"/>
  <!-- FIM TRILHO -->

  <!-- INÍCIO ETAPAS -->
    <g class="step" style="animation-delay:0.87s">
      <polygon class="diamond" points="34,89 41,96 34,103 27,96" style="animation-delay:0.87s"/>
      <text class="num" x="56" y="101" style="animation-delay:0.87s">01</text>
      <text class="label" x="88" y="101" style="animation-delay:0.87s">existing design</text>
    </g>
    <g class="step" style="animation-delay:1.48s">
      <polygon class="diamond" points="34,129 41,136 34,143 27,136" style="animation-delay:1.48s"/>
      <text class="num" x="56" y="141" style="animation-delay:1.48s">02</text>
      <text class="label" x="88" y="141" style="animation-delay:1.48s">structure</text>
    </g>
    <g class="step" style="animation-delay:2.08s">
      <polygon class="diamond" points="34,169 41,176 34,183 27,176" style="animation-delay:2.08s"/>
      <text class="num" x="56" y="181" style="animation-delay:2.08s">03</text>
      <text class="label" x="88" y="181" style="animation-delay:2.08s">implementation</text>
    </g>
    <g class="step" style="animation-delay:2.69s">
      <polygon class="diamond" points="34,209 41,216 34,223 27,216" style="animation-delay:2.69s"/>
      <text class="num" x="56" y="221" style="animation-delay:2.69s">04</text>
      <text class="label" x="88" y="221" style="animation-delay:2.69s">responsive design</text>
    </g>
    <g class="step" style="animation-delay:3.29s">
      <polygon class="diamond" points="34,249 41,256 34,263 27,256" style="animation-delay:3.29s"/>
      <text class="num" x="56" y="261" style="animation-delay:3.29s">05</text>
      <text class="label" x="88" y="261" style="animation-delay:3.29s">accessibility</text>
    </g>
    <g class="step" style="animation-delay:3.90s">
      <polygon class="diamond" points="34,289 41,296 34,303 27,296" style="animation-delay:3.90s"/>
      <text class="num" x="56" y="301" style="animation-delay:3.90s">06</text>
      <text class="label" x="88" y="301" style="animation-delay:3.90s">refinement</text>
    </g>
  <!-- FIM ETAPAS -->
</svg>
