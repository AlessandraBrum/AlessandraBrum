  <title id="titulo">From interface to code</title>
  <desc id="descricao">Six-step flow, from interface to code: 01 existing design, 02 structure, 03 implementation, 04 responsive design, 05 accessibility, 06 refinement.</desc>

  
  <style>
    /* Paleta do portfólio (todas as cores de texto passam no AAA sobre o fundo #100E18) */
    text { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    .fundo { fill: #100E18; stroke: #2B2340; }

    /* Rótulo "interface → código" (estado final) */
    .from-box { fill: #141020; stroke: #3D3160; }
    .from-txt { fill: #F1EEF8; font-size: 15px; }
    .seta { fill: #B4A3FF; font-size: 15px; }
    .to-box { fill: #B4A3FF; }
    .to-glow { fill: #B4A3FF; opacity: .45; }
    .to-txt { fill: #100E18; font-size: 15px; font-weight: 700; }

    /* Trilho tracejado e trilho aceso */
    .trilho { stroke: #3D3160; stroke-width: 1; stroke-dasharray: 3 3; }
    .trilho-aceso { stroke: #B4A3FF; stroke-width: 1.5; }

    /* Etapas (estado final: losango preenchido, número lilás, texto claro) */
    .diamond { fill: #B4A3FF; stroke: #B4A3FF; stroke-width: 1.5; transform-box: fill-box; transform-origin: center; }
    .num { fill: #B4A3FF; font-size: 14px; }
    .label { fill: #F1EEF8; font-size: 16px; }
    .cometa { fill: #C9BEFF; opacity: 0; }



    /* INÍCIO MOVIMENTO REDUZIDO: o sistema operacional manda, sem exceção */
    .static { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .motion { display: none; }
      .static { display: inline; }
    }
    /* FIM MOVIMENTO REDUZIDO */
  </style>
  

  
